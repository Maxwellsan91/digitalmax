<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ati-bg" x1="10" y1="10" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="0.44" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Outer glow -->
  <rect x="2" y="2" width="176" height="176" rx="44" fill="#06B6D4" fill-opacity="0.18"/>
  <!-- Background -->
  <rect x="8" y="8" width="164" height="164" rx="38" fill="url(#ati-bg)"/>
  <!-- Top glass highlight -->
  <rect x="8" y="8" width="164" height="84" rx="38" fill="white" fill-opacity="0.09"/>
  <!-- Inner border -->
  <rect x="8" y="8" width="164" height="164" rx="38" fill="none" stroke="white" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Ascending bars — baseline at y=156 -->
  <rect x="28"  y="108" width="34" height="48" rx="8" fill="white" fill-opacity="0.46"/>
  <rect x="74"  y="80"  width="34" height="76" rx="8" fill="white" fill-opacity="0.74"/>
  <rect x="120" y="52"  width="34" height="104" rx="8" fill="white"/>

  <!-- Trend line -->
  <polyline points="45,108 91,80 137,52"
    stroke="white" stroke-opacity="0.38" stroke-width="4"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak glow ring -->
  <circle cx="137" cy="40" r="18" fill="#BAE6FD" fill-opacity="0.26"/>
  <!-- Peak dot -->
  <circle cx="137" cy="40" r="10" fill="#BAE6FD" fill-opacity="0.84"/>
  <circle cx="137" cy="40" r="5.5" fill="white"/>
</svg>
